openapi: 3.0.3
info:
  title: Meeting Room Booking API
  description: REST API untuk manajemen ruangan meeting dan pemesanan jadwal berbasis Go (Gin) dan PostgreSQL.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local / Docker Server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@test.com
        password:
          type: string
          example: password123

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    CreateRoomRequest:
      type: object
      required: [name, capacity]
      properties:
        name:
          type: string
          example: Ruang Meeting A
        capacity:
          type: integer
          minimum: 1
          example: 10

    Room:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Ruang Meeting A
        capacity:
          type: integer
          example: 10
        is_active:
          type: boolean
          example: true

    AvailableRoom:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Ruang Meeting A
        capacity:
          type: integer
          example: 10

    CreateBookingRequest:
      type: object
      required: [room_id, title, start_time, end_time]
      properties:
        room_id:
          type: integer
          minimum: 1
          example: 1
        title:
          type: string
          example: Sprint Planning
        start_time:
          type: string
          format: date-time
          description: Format ISO-8601 UTC
          example: "2026-12-01T10:00:00Z"
        end_time:
          type: string
          format: date-time
          description: Format ISO-8601 UTC
          example: "2026-12-01T12:00:00Z"

    Booking:
      type: object
      properties:
        id:
          type: integer
          example: 1
        room_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        title:
          type: string
          example: Sprint Planning
        start_time:
          type: string
          format: date-time
          example: "2026-12-01T10:00:00Z"
        end_time:
          type: string
          format: date-time
          example: "2026-12-01T12:00:00Z"
        status:
          type: string
          enum: [CONFIRMED, CANCELLED]
          example: CONFIRMED

    CancelBookingResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        status:
          type: string
          example: CANCELLED

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: invalid credentials

    BookingErrorResponse:
      type: object
      properties:
        error_code:
          type: string
          example: ROOM_CONFLICT
        message:
          type: string
          example: Ruangan sudah dipesan pada rentang waktu tersebut

paths:
  /health:
    get:
      summary: Health Check
      tags: [System]
      responses:
        "200":
          description: Server berjalan normal
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/auth/login:
    post:
      summary: Login User / Admin
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Email atau password salah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/rooms:
    post:
      summary: Tambah Ruangan Baru (Khusus ADMIN)
      tags: [Rooms]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
      responses:
        "201":
          description: Ruangan berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Request tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid atau tidak ada
        "403":
          description: Akses ditolak (bukan ADMIN)

  /api/v1/rooms/available:
    get:
      summary: Cari Ruangan Tersedia
      tags: [Rooms]
      security:
        - BearerAuth: []
      parameters:
        - name: start
          in: query
          required: true
          description: Waktu mulai (ISO-8601 UTC)
          schema:
            type: string
            format: date-time
            example: "2026-12-01T10:00:00Z"
        - name: end
          in: query
          required: true
          description: Waktu selesai (ISO-8601 UTC)
          schema:
            type: string
            format: date-time
            example: "2026-12-01T12:00:00Z"
      responses:
        "200":
          description: Daftar ruangan aktif yang tersedia
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AvailableRoom"
        "400":
          description: Format waktu salah atau end <= start
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid

  /api/v1/bookings:
    post:
      summary: Buat Booking Baru
      description: Menggunakan database transaction dan row-level locking (SELECT ... FOR UPDATE) untuk mencegah double booking.
      tags: [Bookings]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Booking berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Waktu tidak valid (INVALID_TIME) atau ruangan tidak aktif (ROOM_INACTIVE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingErrorResponse"
        "401":
          description: Token tidak valid
        "404":
          description: Ruangan tidak ditemukan (ROOM_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingErrorResponse"
        "409":
          description: Jadwal bentrok dengan booking CONFIRMED lain (ROOM_CONFLICT)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingErrorResponse"

  /api/v1/bookings/{id}/cancel:
    patch:
      summary: Batalkan Booking
      description: Hanya dapat dilakukan oleh pemilik booking atau ADMIN.
      tags: [Bookings]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID Booking
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Booking berhasil dibatalkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelBookingResponse"
        "400":
          description: ID tidak valid atau booking sudah dibatalkan sebelumnya
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token tidak valid
        "403":
          description: Tidak memiliki izin membatalkan booking ini
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Booking tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
