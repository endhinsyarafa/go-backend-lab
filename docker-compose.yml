services:
  postgres:
    image: postgres:16-alpine
    container_name: meeting_room_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: meeting_room_booking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meeting_room_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: meeting_room_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: secretpassword
      DB_NAME: meeting_room_booking
      DB_SSLMODE: disable
      JWT_SECRET: rahasia_jwt_super_aman_123
    ports:
      - "8080:8080"

volumes:
  pgdata:
